<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Notes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Quick Notes</h1>
    <p>Jot it down. Find it later.</p>
  </header>

  <main>
    <section class="card" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a note</h2>
      <form id="note-form">
        <label for="note-input">Note</label>
        <input type="text" id="note-input" placeholder="What's on your mind?" autocomplete="off">

        <label for="note-category">Category</label>
        <select id="note-category">
          <option value="personal">Personal</option>
          <option value="work">Work</option>
          <option value="study">Study</option>
        </select>

        <button type="submit">Add Note</button>
      </form>
      <p id="error-message" role="alert"></p>
    </section>

    <section class="card" aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>

      <label for="search-input">Search notes</label>
      <input type="search" id="search-input" placeholder="Type to search...">

      <p id="note-count"></p>
      <ul id="notes-list"></ul>

      <button type="button" id="clear-all">Clear all</button>
    </section>
  </main>

  <footer>
    <p>Quick Notes &mdash; your notes are saved in this browser.</p>
  </footer>
</body>
</html>
